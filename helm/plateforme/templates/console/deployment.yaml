{{- if .Values.console.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plateforme.fullname" . }}-console
  labels:
    {{- include "plateforme.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      {{- include "plateforme.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        {{- include "plateforme.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: console
    spec:
      affinity:
        {{- if .Values.console.affinity }}
        {{- toYaml .Values.console.affinity | nindent 8 }}
        {{- else }}
        # Console stateless (pas de PV local) : anti-affinité zone en preferred
        # pour répartir les réplicas sans bloquer le scheduling.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels:
                    {{- include "plateforme.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: console
        {{- end }}
      initContainers:
        {{- include "plateforme.waitForControlplane" . | nindent 8 }}
        {{- if .Values.keycloak.enabled }}
        {{- include "plateforme.waitForKeycloak" . | nindent 8 }}
        {{- end }}
      containers:
        - name: console
          image: {{ include "plateforme.imageWithOverrides" (dict "component" "console" "imageConfig" .Values.console.image "context" .) }}
          imagePullPolicy: {{ .Values.console.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: CONTROLPLANE_URL
              value: {{ include "plateforme.controlplaneUrl" . | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.console.config.oidcClientId | quote }}
            - name: OIDC_PROVIDER_NAME
              value: {{ .Values.console.config.oidcProviderName | quote }}
            - name: OIDC_PROVIDER_URL
              value: {{ include "plateforme.keycloakRealmUrl" . | quote }}
            - name: APPLICATION_MODE
              value: {{ .Values.console.config.applicationMode | quote }}
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
{{- end }}
