{{- if and .Values.console.enabled .Values.console.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "plateforme.fullname" . }}-console
  labels:
    {{- include "plateforme.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
  annotations:
    ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: {{ .Values.console.ingress.clusterIssuer | quote }}
    betterstack.io/monitor: "true"
    betterstack.io/group: "console"
    betterstack.io/check-frequency: "300"
    {{- with .Values.console.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # ingressClassName est requis par Capsule
  ingressClassName: {{ .Values.console.ingress.className }}
  rules:
    - host: {{ required "console.ingress.host is required when console.ingress.enabled" .Values.console.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "plateforme.fullname" . }}-console
                port:
                  number: 80
  tls:
    - hosts:
        - {{ .Values.console.ingress.host | quote }}
      secretName: {{ .Values.console.ingress.tlsSecretName | default (printf "%s-console-tls" (include "plateforme.fullname" .)) }}
{{- end }}
