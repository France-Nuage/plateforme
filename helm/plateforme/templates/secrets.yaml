{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plateforme.secretName" . }}
  labels:
    {{- include "plateforme.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "secrets.postgresPassword est requis pour lacces a la bd" .Values.secrets.postgresPassword | quote }}

  database-url: {{ include "plateforme.postgresUrl" . | quote }}

  spicedb-preshared-key: {{ required "secrets.spicedbPresharedKey est requis pour spicedb" .Values.secrets.spicedbPresharedKey | quote }}

  {{- if .Values.keycloak.enabled }}
  keycloak-admin-password: {{ required "secrets.keycloakAdminPassword est requis si keycloak est active" .Values.secrets.keycloakAdminPassword | quote }}
  {{- end }}

  {{- if or .Values.spicedbDb.enabled .Values.spicedb.useSharedDatabase }}
  spicedb-db-password: {{ required "secrets.spicedbPassword est requis pour spicedb" .Values.secrets.spicedbPassword | quote }}
  {{- end }}

  {{- if or .Values.keycloakDb.enabled .Values.keycloak.enabled }}
  keycloak-db-password: {{ .Values.secrets.keycloakDbPassword | default .Values.secrets.postgresPassword | quote }}
  {{- end }}

  {{- if .Values.controlplane.enabled }}
  root-service-account-key: {{ required "secrets.rootServiceAccountKey est requis pour controlplane" .Values.controlplane.config.rootServiceAccountKey | quote }}

  {{- if .Values.controlplane.config.bff.enabled }}
  oidc-client-secret: {{ required "secrets.oidcClientSecret est requis quand le BFF est actif" .Values.secrets.oidcClientSecret | quote }}
  auth-cookie-key: {{ required "secrets.authCookieKey (base64, 32 octets) est requis quand le BFF est actif" .Values.secrets.authCookieKey | quote }}
  {{- end }}

  {{- if .Values.secrets.hoopApiKey }}
  hoop-api-key: {{ .Values.secrets.hoopApiKey | quote }}
  {{- end }}

  {{- /*
  Stripe billing secrets. Emitted only when billing is enabled (both keys set);
  the control plane and the webhook relay consume them by secretKeyRef. The
  webhook secret (whsec_...) is the signing secret used to verify inbound Stripe
  webhooks; in ephemeral environments it is the Stripe CLI relay's stable secret.
  */}}
  {{- if include "plateforme.billingEnabled" . }}
  stripe-secret-key: {{ .Values.secrets.stripeSecretKey | quote }}
  stripe-webhook-secret: {{ .Values.secrets.stripeWebhookSecret | quote }}
  {{- end }}
  {{- end }}

  {{- if or .Values.controlplane.enabled .Values.operationWorker.enabled }}
  {{- /*
  The KEK is consumed by both the controlplane (encrypt) and the operation-worker
  (decrypt). Emitting it whenever either component is enabled prevents a pod crash
  when the controlplane is disabled but the worker is still running.
  */}}
  kubeconfig-encryption-key: {{ required "controlplane.config.kubeconfigEncryptionKey (base64 de 32 octets) est requis pour chiffrer les kubeconfigs" .Values.controlplane.config.kubeconfigEncryptionKey | quote }}
  worker-token: {{ required "secrets.workerToken est requis pour l'authentification du worker" .Values.secrets.workerToken | quote }}
  ci-service-token: {{ required "secrets.ciServiceToken est requis pour l'authentification CI" .Values.secrets.ciServiceToken | quote }}
  {{- /*
  Charts registry read credentials (GitLab Container Registry), used by the
  control plane to discover deployable chart versions from the OCI registry at
  startup. Optional: emitted only when both are provided; absent them, discovery
  is skipped.
  */}}
  {{- if and .Values.secrets.chartsRegistryUser .Values.secrets.chartsRegistryToken }}
  charts-registry-user: {{ .Values.secrets.chartsRegistryUser | quote }}
  charts-registry-token: {{ .Values.secrets.chartsRegistryToken | quote }}
  {{- end }}
  {{- end }}

  {{- /*
  Kubeconfig of the cluster the ephemeral environment runs on, consumed by the
  payment E2E to enrol a hosting cluster. Only emitted when provided (billing CI).
  */}}
  {{- with .Values.systemTests.config.deployKubeconfig }}
  deploy-kubeconfig: {{ . | quote }}
  {{- end }}
{{- end }}