{{- if .Values.systemTests.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "plateforme.fullname" . }}-system-tests
  labels:
    {{- include "plateforme.labels" . | nindent 4 }}
    app.kubernetes.io/component: system-tests
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "plateforme.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: system-tests
    spec:
      restartPolicy: Never
      {{- include "plateforme.testsHostAliases" . | nindent 6 }}
      initContainers:
        {{- if .Values.keycloak.enabled }}
        {{- include "plateforme.waitForKeycloak" . | nindent 8 }}
        {{- end }}
        {{- include "plateforme.waitForPublicEndpoints" . | nindent 8 }}
      containers:
        - name: system-tests
          image: {{ include "plateforme.imageWithOverrides" (dict "component" "system-tests" "imageConfig" .Values.systemTests.image "context" .) }}
          imagePullPolicy: {{ .Values.systemTests.image.pullPolicy | default .Values.global.imagePullPolicy }}
          command:
            - npm
            - run
            - test:ci
          env:
            - name: CONSOLE_URL
              value: {{ include "plateforme.consoleUrl" . | quote }}
            - name: CONTROLPLANE_URL
              value: {{ include "plateforme.controlplaneUrl" . | quote }}
            - name: ROOT_ORGANIZATION_NAME
              value: {{ .Values.controlplane.config.rootOrganizationName | quote }}
            - name: ROOT_SERVICE_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "plateforme.secretName" . }}
                  key: root-service-account-key
            {{- /*
            CI service token: authenticates administrative RPCs the tests use as
            preconditions (e.g. RegisterVersion, which makes a managed service
            deployable). Same token the control plane validates via authenticate_ci.
            */}}
            - name: CI_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "plateforme.secretName" . }}
                  key: ci-service-token
            {{- if .Values.keycloak.enabled }}
            - name: KEYCLOAK_URL
              value: {{ include "plateforme.keycloakUrl" . | quote }}
            - name: KEYCLOAK_ADMIN
              value: {{ .Values.systemTests.config.keycloakAdmin | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "plateforme.secretName" . }}
                  key: keycloak-admin-password
            - name: OIDC_CLIENT_ID
              value: {{ .Values.systemTests.config.oidcClientId | quote }}
            - name: OIDC_PROVIDER_URL
              value: {{ include "plateforme.keycloakRealmUrl" . | quote }}
            {{- end }}
            {{- if .Values.systemTests.config.headless }}
            - name: HEADLESS
              value: "true"
            {{- end }}
            {{- /*
            Signals to the payment E2E whether billing is wired up. When unset
            (no Stripe secrets), the spec skips instead of failing on a checkout
            it can never reach. Emitted only when billing is enabled.
            */}}
            {{- if include "plateforme.billingEnabled" . }}
            - name: BILLING_ENABLED
              value: "true"
            {{- end }}
            {{- /*
            Deploy-cluster precondition for the payment E2E: the founding admin
            email (matched to the bootstrap admin the control plane seeds) and
            the kubeconfig of the cluster the environment runs on, which the test
            enrols as a hosting cluster. Both are only needed for the billing
            flow; emitted when billing is enabled and the kubeconfig is provided.
            */}}
            {{- if and (include "plateforme.billingEnabled" .) .Values.controlplane.config.rootAdminEmail .Values.systemTests.config.deployKubeconfig }}
            - name: ROOT_ADMIN_EMAIL
              value: {{ .Values.controlplane.config.rootAdminEmail | quote }}
            - name: DEPLOY_KUBECONFIG
              valueFrom:
                secretKeyRef:
                  name: {{ include "plateforme.secretName" . }}
                  key: deploy-kubeconfig
            {{- end }}
          resources:
            {{- toYaml .Values.systemTests.resources | nindent 12 }}
          {{- if .Values.systemTests.report.enabled }}
          volumeMounts:
            - name: report
              mountPath: /app/playwright-report
          {{- end }}
      {{- if .Values.systemTests.report.enabled }}
      volumes:
        - name: report
          persistentVolumeClaim:
            claimName: {{ include "plateforme.fullname" . }}-playwright-report
      {{- end }}
{{- end }}
