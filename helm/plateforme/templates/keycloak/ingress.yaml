{{- if and .Values.ingress.baseDomain .Values.keycloak.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "plateforme.fullname" . }}-keycloak
  labels:
    {{- include "plateforme.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
  annotations:
    ingress.kubernetes.io/ssl-redirect: "true"
    {{- include "plateforme.ingressCertManagerAnnotation" . | nindent 4 }}
    {{- if .Values.ingress.monitoring }}
    betterstack.io/monitor: "true"
    betterstack.io/group: "keycloak"
    betterstack.io/check-frequency: "300"
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # ingressClassName est requis par Capsule
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ include "plateforme.keycloakHost" . | quote }}
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "plateforme.fullname" . }}-keycloak
                port:
                  number: 8080
  tls:
    - hosts:
        - {{ include "plateforme.keycloakHost" . | quote }}
      secretName: {{ include "plateforme.ingressTlsSecret" (dict "default" (printf "%s-keycloak-tls" (include "plateforme.fullname" .)) "ctx" .) }}
{{- end }}
