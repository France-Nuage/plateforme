{{- if and .Values.keycloak.enabled .Values.keycloak.config.importRealm }}
{{- $realm := .Files.Get "files/keycloak-realm.json" | fromJson }}
{{- /*
  The imported realm hardcodes console.test as the client redirect origin, which
  only matches the local docker-compose setup. When an ingress baseDomain is set
  (CI, prod), append the public console origin so Keycloak accepts the OIDC
  redirect back to the deployed console.
*/}}
{{- if .Values.ingress.baseDomain }}
{{- $consoleUrl := include "plateforme.consoleUrl" . }}
{{- range $client := $realm.clients }}
{{- if eq $client.clientId "francenuage" }}
{{- $client = set $client "redirectUris" (append $client.redirectUris (printf "%s/*" $consoleUrl)) }}
{{- $client = set $client "webOrigins" (append $client.webOrigins $consoleUrl) }}
{{- end }}
{{- end }}
{{- end }}
{{- /*
  Confidential-client BFF: the control plane runs the OIDC authorization-code
  flow server-side (client_secret_post, no PKCE) as a confidential client.
  Register the matching confidential client in the imported realm so the code
  exchange and the callback redirect are accepted. Its secret is the same value
  the control plane reads from the k8s Secret (secrets.oidcClientSecret); its
  single valid redirect URI is the control plane's /auth/callback (must match the
  OIDC_REDIRECT_URL the control plane sends). The public `francenuage` client is
  left untouched — the test harness still uses it for the direct-grant
  (grant_type=password) token minting, which a confidential client would reject.
*/}}
{{- if .Values.controlplane.config.bff.enabled }}
{{- $callback := .Values.controlplane.config.bff.redirectUrl | default (printf "https://%s/auth/callback" (include "plateforme.controlplaneHost" .)) }}
{{- $consoleClient := dict
      "clientId" .Values.controlplane.config.bff.clientId
      "name" "France Nuage Console (BFF confidential client)"
      "enabled" true
      "protocol" "openid-connect"
      "publicClient" false
      "secret" (required "secrets.oidcClientSecret est requis quand le BFF est actif" .Values.secrets.oidcClientSecret)
      "standardFlowEnabled" true
      "implicitFlowEnabled" false
      "directAccessGrantsEnabled" false
      "serviceAccountsEnabled" false
      "redirectUris" (list $callback)
      "webOrigins" (list)
      "attributes" (dict "post.logout.redirect.uris" "+") }}
{{- $realm = set $realm "clients" (append $realm.clients $consoleClient) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "plateforme.fullname" . }}-keycloak-realm
  labels:
    {{- include "plateforme.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
data:
  francenuage-realm.json: |
    {{ $realm | toJson | nindent 4 }}
{{- end }}
