{{- if .Values.controlplane.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plateforme.fullname" . }}-controlplane
  labels:
    {{- include "plateforme.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
spec:
  replicas: {{ .Values.controlplane.replicas }}
  selector:
    matchLabels:
      {{- include "plateforme.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controlplane
  template:
    metadata:
      annotations:
        # Scrape des compteurs BFF (auth_login/callback_reject/refresh) exposés sur
        # GET /metrics — même écouteur HTTP que gRPC-web (port 80). Consommés par les
        # alertes charts/grafana/orgs/france-nuage/rules/bff-auth.yaml.
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "plateforme.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controlplane
    spec:
      affinity:
        {{- include "plateforme.dbColocation" . | nindent 8 }}
      {{- include "plateforme.oidcHairpinHostAliases" . | nindent 6 }}
      initContainers:
        {{- include "plateforme.waitForPostgres" . | nindent 8 }}
        {{- include "plateforme.runAtlasMigrations" . | nindent 8 }}
        {{- include "plateforme.waitForSpicedb" . | nindent 8 }}
        {{- include "plateforme.runSpicedbMigrations" . | nindent 8 }}
        {{- if .Values.keycloak.enabled }}
        {{- include "plateforme.waitForKeycloak" . | nindent 8 }}
        {{- end }}
      volumes:
        - name: spicedb-schema
          configMap:
            name: {{ include "plateforme.fullname" . }}-spicedb-schema
      containers:
        - name: controlplane
          image: {{ include "plateforme.imageWithOverrides" (dict "component" "controlplane" "imageConfig" .Values.controlplane.image "context" .) }}
          imagePullPolicy: {{ .Values.controlplane.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: grpc
              containerPort: 80
              protocol: TCP
            - name: webhook
              containerPort: 8081
              protocol: TCP
          env:
            - name: CONTROLPLANE_ADDR
              value: {{ .Values.controlplane.config.addr | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "plateforme.secretName" . }}
                  key: postgres-password
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "plateforme.secretName" . }}
                  key: database-url
            - name: SPICEDB_URL
              value: {{ include "plateforme.spicedbUrl" . | quote }}
            - name: SPICEDB_GRPC_PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "plateforme.secretName" . }}
                  key: spicedb-preshared-key
            - name: CONSOLE_URL
              value: {{ include "plateforme.consoleUrl" . | quote }}
            {{- if .Values.controlplane.config.oidcUrl }}
            - name: OIDC_URL
              value: {{ .Values.controlplane.config.oidcUrl | quote }}
            {{- else if .Values.keycloak.enabled }}
            - name: OIDC_URL
              value: {{ include "plateforme.keycloakOidcUrl" . | quote }}
            {{- end }}
            {{- if .Values.controlplane.config.bff.enabled }}
            # BFF client confidentiel : présence d'OIDC_CLIENT_SECRET => mode BFF actif.
            - name: OIDC_CLIENT_ID
              value: {{ .Values.controlplane.config.bff.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "plateforme.secretName" . }}
                  key: oidc-client-secret
            - name: OIDC_REDIRECT_URL
              value: {{ .Values.controlplane.config.bff.redirectUrl | default (printf "https://%s/auth/callback" (include "plateforme.controlplaneHost" .)) | quote }}
            - name: AUTH_COOKIE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "plateforme.secretName" . }}
                  key: auth-cookie-key
            - name: AUTH_COOKIE_SAMESITE
              value: {{ .Values.controlplane.config.bff.cookieSameSite | quote }}
            {{- if .Values.controlplane.config.bff.cookieDomain }}
            - name: AUTH_COOKIE_DOMAIN
              value: {{ .Values.controlplane.config.bff.cookieDomain | quote }}
            {{- end }}
            {{- if .Values.controlplane.config.bff.sessionMaxTtl }}
            - name: SESSION_MAX_TTL
              value: {{ .Values.controlplane.config.bff.sessionMaxTtl | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.controlplane.config.logLevel }}
            - name: LOG_LEVEL
              value: {{ .Values.controlplane.config.logLevel | quote }}
            {{- end }}
            - name: ROOT_ORGANIZATION_NAME
              value: {{ .Values.controlplane.config.rootOrganizationName | quote }}
            {{- /*
            Founding platform admin. When set, the control plane seeds/promotes
            this email to platform admin at startup (a fresh install otherwise
            has no admin and cannot register a hosting cluster). Optional: unset
            means no admin is bootstrapped.
            */}}
            {{- with .Values.controlplane.config.rootAdminEmail }}
            - name: ROOT_ADMIN_EMAIL
              value: {{ . | quote }}
            {{- end }}
            - name: ROOT_SERVICE_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "plateforme.secretName" . }}
                  key: root-service-account-key
            - name: KUBECONFIG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "plateforme.secretName" . }}
                  key: kubeconfig-encryption-key
            {{- if .Values.secrets.hoopApiKey }}
            - name: HOOP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "plateforme.secretName" . }}
                  key: hoop-api-key
            {{- end }}
            {{- if .Values.controlplane.config.hoopApiUrl }}
            - name: HOOP_API_URL
              value: {{ .Values.controlplane.config.hoopApiUrl | quote }}
            {{- end }}
            {{- if .Values.controlplane.config.deploymentLabels }}
            - name: DEPLOYMENT_LABELS
              value: {{ .Values.controlplane.config.deploymentLabels | quote }}
            {{- end }}
            {{- if .Values.controlplane.config.deploymentAnnotations }}
            - name: DEPLOYMENT_ANNOTATIONS
              value: {{ .Values.controlplane.config.deploymentAnnotations | quote }}
            {{- end }}
            - name: WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "plateforme.secretName" . }}
                  key: worker-token
            - name: CI_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "plateforme.secretName" . }}
                  key: ci-service-token
            {{- /*
            Charts registry read credentials, to discover deployable chart
            versions from the OCI registry at startup. Emitted only when provided.
            */}}
            {{- if and .Values.secrets.chartsRegistryUser .Values.secrets.chartsRegistryToken }}
            - name: CHARTS_REGISTRY_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "plateforme.secretName" . }}
                  key: charts-registry-user
            - name: CHARTS_REGISTRY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "plateforme.secretName" . }}
                  key: charts-registry-token
            {{- end }}
            {{- if include "plateforme.billingEnabled" . }}
            {{- /*
            Stripe billing. The keys come from the shared secret; the checkout
            success/cancel URLs are derived from the console host so they follow
            each ephemeral environment automatically (never hardcoded).
            */}}
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "plateforme.secretName" . }}
                  key: stripe-secret-key
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "plateforme.secretName" . }}
                  key: stripe-webhook-secret
            - name: STRIPE_CHECKOUT_SUCCESS_URL
              value: {{ include "plateforme.stripeCheckoutSuccessUrl" . | quote }}
            - name: STRIPE_CHECKOUT_CANCEL_URL
              value: {{ include "plateforme.stripeCheckoutCancelUrl" . | quote }}
            {{- end }}
          livenessProbe:
            exec:
              command: ["/bin/grpc_health_probe", "-addr=localhost:80"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            exec:
              command: ["/bin/grpc_health_probe", "-addr=localhost:80"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.controlplane.resources | nindent 12 }}
        {{- if and (include "plateforme.billingEnabled" .) .Values.controlplane.config.billing.webhookRelay.enabled }}
        {{- /*
        Stripe webhook relay sidecar. Ephemeral environments have no public
        webhook ingress, so `stripe listen` forwards Stripe events to the
        control plane's in-pod webhook port (8081) over localhost. Its signing
        secret must equal secrets.stripeWebhookSecret (the CLI's endpoint secret
        is stable per account: `stripe listen --print-secret`), so the control
        plane verifies the forwarded events with the same secret it was given.
        */}}
        - name: stripe-webhook-relay
          image: {{ printf "%s:%s" .Values.controlplane.config.billing.webhookRelay.image.repository .Values.controlplane.config.billing.webhookRelay.image.tag | quote }}
          imagePullPolicy: {{ .Values.controlplane.config.billing.webhookRelay.image.pullPolicy | default .Values.global.imagePullPolicy }}
          args:
            - listen
            - --api-key
            - $(STRIPE_SECRET_KEY)
            - --forward-to
            - http://localhost:8081/webhooks/stripe
          env:
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "plateforme.secretName" . }}
                  key: stripe-secret-key
            {{- /*
            Pin the relay to the same endpoint signing secret the control plane
            verifies against, instead of letting the CLI mint an ephemeral one.
            */}}
            - name: STRIPE_CLI_WEBHOOK_ENDPOINT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "plateforme.secretName" . }}
                  key: stripe-webhook-secret
          resources:
            {{- toYaml .Values.controlplane.config.billing.webhookRelay.resources | nindent 12 }}
        {{- end }}
{{- end }}
