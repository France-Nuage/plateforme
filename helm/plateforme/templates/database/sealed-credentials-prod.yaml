{{- if .Values.secrets.existingSecret }}
# Identifiants CNPG scellés pour plateforme-prod (superuser + rôles keycloak/spicedb).
# Consommés par templates/database/cnpg-cluster.yaml (superuserSecret + managed.roles).
# Scope strict -> liés au nom + namespace ci-dessous. Rendu prod uniquement.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: plateforme-prod-postgres-superuser
  namespace: plateforme-prod
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: plateforme-prod-postgres-superuser
      namespace: plateforme-prod
    type: kubernetes.io/basic-auth
---
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: plateforme-prod-keycloak-db-cred
  namespace: plateforme-prod
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: plateforme-prod-keycloak-db-cred
      namespace: plateforme-prod
    type: kubernetes.io/basic-auth
---
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: plateforme-prod-spicedb-db-cred
  namespace: plateforme-prod
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: plateforme-prod-spicedb-db-cred
      namespace: plateforme-prod
    type: kubernetes.io/basic-auth
---
{{- end }}
