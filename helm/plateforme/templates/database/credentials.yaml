{{- if and .Values.postgres.enabled (not .Values.secrets.existingSecret) }}
{{- $fullname := include "plateforme.fullname" . }}
# Secrets basic-auth consommés par CNPG (superuserSecret + managed.roles).
# Rendu uniquement hors-prod (dev/ci) où les mots de passe vivent dans les values.
# En prod (secrets.existingSecret), ces 3 secrets sont fournis scellés à part.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-postgres-superuser
  labels:
    {{- include "plateforme.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgres.auth.username | quote }}
  password: {{ required "secrets.postgresPassword requis hors existingSecret" .Values.secrets.postgresPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-keycloak-db-cred
  labels:
    {{- include "plateforme.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.keycloakDb.auth.username | quote }}
  password: {{ .Values.secrets.keycloakDbPassword | default .Values.secrets.postgresPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-spicedb-db-cred
  labels:
    {{- include "plateforme.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.spicedbDb.auth.username | quote }}
  password: {{ required "secrets.spicedbPassword requis hors existingSecret" .Values.secrets.spicedbPassword | quote }}
{{- end }}
