{{- if .Values.postgres.enabled }}
{{- $fullname := include "plateforme.fullname" . }}
{{- $clusterDomain := .Values.clusterDomain | default "cluster.local" }}
{{- $rw := printf "%s-db-rw.%s.svc.%s" $fullname .Release.Namespace $clusterDomain }}
# Services alias : conservent les hostnames historiques attendus par les apps
# (helpers + init containers inchangés) en pointant vers le service -rw (primary)
# du Cluster CNPG. Les 3 apps atterrissent ainsi sur le même cluster, chacune
# sur sa base (postgres / keycloak / spicedb).
{{- range $suffix := list "postgres" "keycloak-db" "spicedb-db" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-{{ $suffix }}
  labels:
    {{- include "plateforme.labels" $ | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ExternalName
  externalName: {{ $rw }}
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgresql
---
{{- end }}
{{- end }}
