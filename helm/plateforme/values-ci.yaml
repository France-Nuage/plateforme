global:
  imageTag: "development"  

# The qualif cluster serves the "qual.local" DNS zone (kubelet clusterDomain),
# not the standard "cluster.local". In-cluster service FQDNs must match it.
clusterDomain: qual.local

# On qualif the public OIDC URL (auth.<baseDomain>) does not hairpin back to the
# in-cluster ingress, so the control plane cannot reach Keycloak at startup.
# Pin the Keycloak host to the kingress-nodeport ClusterIP to keep the lookup
# in-cluster while preserving the public hostname/issuer.
oidcHairpinIp: "192.168.250.128"

ingress:
  # TLS is terminated upstream in prod (zero-trust) and forwarded as HTTP to the
  # qualif cluster; a local HTTPS redirect would loop, so disable it here.
  sslRedirect: false

spicedbDb:
  enabled: true
  persistence:
    enabled: true
    size: 1Gi
    storageClass: "ceph-rbd"

spicedb:
  useSharedDatabase: false

keycloakDb:
  enabled: true
  persistence:
    enabled: true
    size: 1Gi
    storageClass: "ceph-rbd"

keycloak:
  enabled: true
  config:
    startCommand: "start-dev"
    importRealm: true
    hostnameStrict: "false"
    httpEnabled: "true"
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
postgres:
  cnpg:
    instances: 1
    storageClass: "ceph-rbd"
    size: 10Gi
    backup:
      enabled: false

console:
  enabled: true
  config:
    apiUrl: "" 

systemTests:
  enabled: true
  config:
    headless: true
  report:
    enabled: true
    storageClass: cephfs

controlplane:
  config:
    consoleUrl: ""
    oidcUrl: ""
    # BFF confidentiel : même flux qu'en prod, mais contre le Keycloak in-cluster
    # de l'env CI. oidcUrl laissé vide → OIDC_URL dérive du helper keycloakOidcUrl
    # (discovery https://auth--<envId>.<baseDomain>/realms/francenuage/.well-known/
    # openid-configuration, résolu in-cluster via oidcHairpinIp ; le browser attaque
    # le même host public). clientId (`console`) et redirectUrl
    # (https://controlplane--<envId>.<baseDomain>/auth/callback) gardent leurs
    # défauts. Le client confidentiel correspondant est injecté dans le realm importé
    # (templates/keycloak/realm-configmap.yaml) avec le secret secrets.oidcClientSecret.
    bff:
      enabled: true

# Secrets du BFF fournis en clair (env CI éphémère, IdP de test) : la prod passe
# par le SealedSecret (secrets.existingSecret), jamais par ce chemin.
# - oidcClientSecret : partagé avec le client Keycloak confidentiel `console`.
# - authCookieKey : clé de scellement du cookie de session frn_session (base64, 32o).
secrets:
  oidcClientSecret: "ci-console-secret"
  authCookieKey: "eu4dANxmmeT/cx7Y7aMy1RCp9ZgCMuoJlTqSzx92Ppo="

synchronizer:
  config:
    oidcUrl: ""
