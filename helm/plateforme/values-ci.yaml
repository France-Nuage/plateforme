global:
  imageTag: "development"  

# The qualif cluster serves the "qual.local" DNS zone (kubelet clusterDomain),
# not the standard "cluster.local". In-cluster service FQDNs must match it.
clusterDomain: qual.local

spicedbDb:
  enabled: true
  persistence:
    enabled: true
    size: 1Gi
    storageClass: "ceph-rbd"

spicedb:
  useSharedDatabase: false

keycloakDb:
  enabled: true
  persistence:
    enabled: true
    size: 1Gi
    storageClass: "ceph-rbd"

keycloak:
  enabled: true
  config:
    startCommand: "start-dev"
    importRealm: true
    hostnameStrict: "false"
    httpEnabled: "true"
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
postgres:
  cnpg:
    instances: 1
    storageClass: "ceph-rbd"
    size: 10Gi
    backup:
      enabled: false

console:
  enabled: true
  config:
    apiUrl: "" 

systemTests:
  enabled: true
  config:
    headless: true

controlplane:
  config:
    consoleUrl: "" 
    oidcUrl: ""     

synchronizer:
  config:
    oidcUrl: ""
