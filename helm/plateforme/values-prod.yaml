global:
  imageTag: "release"

secrets:
  existingSecret: "plateforme-prod-secrets"

spicedbDb:
  enabled: true
  persistence:
    enabled: true
    size: 1Gi
    storageClass: "ceph-rbd"

spicedb:
  useSharedDatabase: false
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

# IAM in-cluster Keycloak décommissionné : remplacé par FerrisKey
# (auth.france-nuage.fr). Laisser à true recréait un Ingress concurrent sur
# auth.france-nuage.fr → le kingress routait vers ce leftover (realm `francenuage`)
# au lieu de FerrisKey → 404 "Realm does not exist" au swap DNS.
keycloakDb:
  enabled: false

keycloak:
  enabled: false

postgres:
  cnpg:
    instances: 2
    storageClass: local
    size: 10Gi
    # StorageClass local = données non déplaçables → anti-affinité zone requise,
    # placement sur les masters (comme l'ancien chart controlplane).
    podAntiAffinityType: required
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/master
                operator: In
                values: ["true"]
    tolerations:
      - key: node-role.kubernetes.io/controlplane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
    backup:
      # Bucket MinIO frn-cnpg-backup-plateforme-prod-db (contient les base backups
      # + WAL de plateforme-prod-db). Le SealedSecret cnpg-backup-s3-credentials
      # porte une service-account du user frn-cnpg-backup-plateforme-prod-db
      # (propriétaire du bucket) — cf. incident 2026-07-22 : les creds pointaient
      # par erreur vers le user ...controlplane-prod → PutObject AccessDenied →
      # archivage WAL cassé → réplica en crashloop → aucun PITR.
      enabled: true
      endpointURL: "https://s3-backup.france-nuage.fr"
      destinationPath: "s3://frn-cnpg-backup-plateforme-prod-db/"
      retentionPolicy: "30d"
      schedule: "0 40 3 * * *"
      s3:
        secretName: "cnpg-backup-s3-credentials"

console:
  enabled: true
  replicas: 2

systemTests:
  enabled: false
  config:
    headless: true

controlplane:
  replicas: 1
  config:
    # Issuer OIDC externe (FerrisKey) : keycloak in-cluster décommissionné, donc
    # le fallback dérivé du baseDomain (realm `francenuage`) ne s'applique pas —
    # l'URL FerrisKey (realm `france-nuage`) est fixée explicitement.
    # OIDC_URL est fetché VERBATIM par le control-plane (bff.rs Bff::discover) et le
    # synchronizer au boot ; il DOIT donc être l'URL de découverte complète
    # (.../.well-known/openid-configuration). La racine de realm renvoie un JSON
    # sans champ `issuer` → panic "missing field issuer" (crashloop au boot).
    oidcUrl: "https://auth.france-nuage.fr/realms/france-nuage/.well-known/openid-configuration"
    logLevel: "warn"
    rootOrganizationName: "France Nuage"
    # BFF confidentiel activé (rollout console-bff). Le flip est atomique : BFF +
    # issuer FerrisKey + swap DNS auth.france-nuage.fr en une bascule. Prérequis
    # remplis : client confidentiel `console` (FerrisKey), SealedSecret
    # plateforme-prod-secrets avec `oidc-client-secret` + `auth-cookie-key`.
    # oidcUrl ci-dessus = découverte FerrisKey (realm france-nuage) une fois le DNS
    # auth.france-nuage.fr basculé ; aucun override CI (le déploiement n'utilise que
    # values-prod.yaml + --set global.image*).
    bff:
      enabled: true
      redirectUrl: "https://controlplane.france-nuage.fr/auth/callback"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

authzWorker:
  replicas: 1
  config:
    logLevel: "warn"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

synchronizer:
  replicas: 1
  config:
    logLevel: "warn"
    rootOrganizationName: "France Nuage"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

ingress:
  baseDomain: france-nuage.fr
  monitoring: true
