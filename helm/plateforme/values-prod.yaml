global:
  imageTag: "release"

secrets:
  existingSecret: "plateforme-prod-secrets"

spicedbDb:
  enabled: true
  persistence:
    enabled: true
    size: 1Gi
    storageClass: "ceph-rbd"

spicedb:
  useSharedDatabase: false
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

keycloakDb:
  enabled: true
  persistence:
    enabled: true
    size: 1Gi
    storageClass: "ceph-rbd"

keycloak:
  enabled: true
  config:
    startCommand: "start-dev"
    importRealm: true
    hostnameStrict: "false"
    httpEnabled: "true"
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2000m"

postgres:
  cnpg:
    instances: 2
    storageClass: local
    size: 10Gi
    # StorageClass local = données non déplaçables → anti-affinité zone requise,
    # placement sur les masters (comme l'ancien chart controlplane).
    podAntiAffinityType: required
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/master
                operator: In
                values: ["true"]
    tolerations:
      - key: node-role.kubernetes.io/controlplane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
    backup:
      # TODO: repasser à true une fois le bucket S3 frn-cnpg-backup-plateforme-prod
      # créé + accès accordé au user cnpg-backup-s3-credentials.
      enabled: false
      endpointURL: "https://s3-backup.france-nuage.fr"
      destinationPath: "s3://frn-cnpg-backup-plateforme-prod/"
      retentionPolicy: "30d"
      schedule: "0 40 3 * * *"
      s3:
        secretName: "cnpg-backup-s3-credentials"

console:
  enabled: true
  replicas: 2
  ingress:
    enabled: true
    host: console.france-nuage.fr
  config:
    apiUrl: ""

systemTests:
  enabled: false
  config:
    headless: true

controlplane:
  replicas: 1
  ingress:
    enabled: true
    host: controlplane.france-nuage.fr
  config:
    consoleUrl: ""
    oidcUrl: ""
    logLevel: "warn"
    rootOrganizationName: "France Nuage"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

authzWorker:
  replicas: 1
  config:
    logLevel: "warn"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

synchronizer:
  replicas: 1
  config:
    logLevel: "warn"
    rootOrganizationName: "France Nuage"
    oidcUrl: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
