global:
  imageRegistry: registry.gitlab.com/getbunker-france-nuage/france-nuage/plateforme
  imageTag: "latest"
  imagePullPolicy: IfNotPresent

secrets:
  existingSecret: ""
  postgresPassword: ""
  spicedbPassword: ""
  spicedbPresharedKey: ""
  keycloakAdminPassword: ""
  workerToken: ""
  ciServiceToken: ""
  # BFF (control-plane client confidentiel OIDC). En prod, fournis via le
  # SealedSecret (existingSecret), clés `oidc-client-secret` + `auth-cookie-key`.
  # auth-cookie-key : clé de chiffrement du cookie de session (base64, 32 octets).
  oidcClientSecret: ""
  authCookieKey: ""
  # Stripe billing secrets. Empty by default: billing stays disabled unless both
  # are provided (see controlplane.config.billing). Injected at deploy time from
  # protected CI variables / a sandbox key — never committed. The webhook secret
  # (whsec_...) is the signing secret the control plane uses to verify inbound
  # webhooks; in ephemeral environments it is the stable secret of the Stripe CLI
  # relay (`stripe listen --print-secret`) that forwards events to the pod.
  stripeSecretKey: ""
  stripeWebhookSecret: ""
  # Charts registry read credentials (GitLab Container Registry). Empty by
  # default: chart-version discovery stays off unless both are provided. Use a
  # deploy token with the read_registry scope. Injected at deploy time, never
  # committed.
  chartsRegistryUser: ""
  chartsRegistryToken: ""

postgres:
  enabled: true
  auth:
    database: postgres
    username: postgres
  # CloudNativePG : un seul Cluster héberge les 3 bases (controlplane sur `postgres`
  # via le superuser, + `keycloak` et `spicedb` dédiées). Voir templates/database/.
  cnpg:
    instances: 1
    imageTag: "16"
    storageClass: ""
    size: 10Gi
    podAntiAffinityType: preferred
    nodeAffinity: {}
    tolerations: []
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "500m"
    backup:
      enabled: false
      endpointURL: "https://s3-backup.france-nuage.fr"
      destinationPath: ""
      retentionPolicy: "30d"
      schedule: "0 40 3 * * *"
      s3:
        secretName: "cnpg-backup-s3-credentials"

spicedbDb:
  enabled: false
  image:
    repository: registry.france-nuage.fr/library/postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    database: spicedb
    username: spicedb
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"

keycloakDb:
  enabled: false
  image:
    repository: registry.france-nuage.fr/library/postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    database: keycloak
    username: keycloak
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"

spicedb:
  enabled: true
  image:
    repository: registry.france-nuage.fr/authzed/spicedb
    tag: "latest"
    pullPolicy: IfNotPresent
  useSharedDatabase: true
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

controlplane:
  enabled: true
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  replicas: 1
  config:
    addr: "0.0.0.0:80"
    logLevel: "info"
    rootOrganizationName: "acme"
    # Email of the founding platform admin, seeded/promoted to admin at startup
    # (like a database engine seeding its root account). Empty => no admin is
    # bootstrapped. Should match an identity the IdP can authenticate.
    rootAdminEmail: ""
    rootServiceAccountKey: "changeme"
    # Base64-encoded 32-byte key encrypting cluster kubeconfigs at rest.
    # Generate with: openssl rand -base64 32. Override in prod via the sealed secret.
    kubeconfigEncryptionKey: ""
    hoopApiKey: ""
    hoopApiUrl: "https://bastion.ssh.france-nuage.fr"
    deploymentLabels: ""
    deploymentAnnotations: ""
    # BFF (Backend-For-Frontend) client confidentiel OIDC. Quand enabled=true, le
    # control-plane fait l'échange de code server-side et n'expose qu'un cookie
    # httpOnly chiffré (aucun token en JS). Requiert les secrets oidc-client-secret
    # + auth-cookie-key (cf. secrets.oidcClientSecret / secrets.authCookieKey).
    bff:
      enabled: false
      clientId: "console"
      # Vide => dérivé de l'host public du control-plane
      # (https://controlplane.<baseDomain>/auth/callback).
      redirectUrl: ""
      cookieSameSite: "lax"
      # Vide => cookie host-only sur l'origine control-plane (recommandé).
      cookieDomain: ""
      # Max-Age du cookie / fenêtre de refresh, en SECONDES ENTIÈRES (le
      # control-plane lit SESSION_MAX_TTL comme un i64 de secondes et échoue au
      # démarrage sur une valeur non entière type "12h" — cf. config.rs
      # parse_session_max_ttl).
      sessionMaxTtl: 43200 # 12h
    # Stripe billing. Enabled only when secrets.stripeSecretKey AND
    # secrets.stripeWebhookSecret are both set. When enabled, the control plane
    # gets its Stripe env (keys + checkout redirect URLs derived from the console
    # host) and — if billing.webhookRelay.enabled — a `stripe listen` sidecar
    # forwards Stripe events to the pod's webhook port (8081). The checkout
    # success/cancel URLs are derived from the console host, so they follow each
    # ephemeral environment automatically (never hardcoded per environment).
    billing:
      # Path of the checkout success redirect, appended to the console URL.
      checkoutSuccessPath: "/managed-services/instances?checkout=success"
      # Path of the checkout cancel redirect, appended to the console URL.
      checkoutCancelPath: "/managed-services?checkout=cancel"
      # In-pod Stripe CLI relay for ephemeral environments (no public webhook
      # ingress). It forwards Stripe events to http://localhost:8081. Its signing
      # secret must equal secrets.stripeWebhookSecret so the control plane can
      # verify the forwarded events (the CLI's endpoint secret is stable per
      # account: fetch it with `stripe listen --print-secret` at deploy time).
      webhookRelay:
        enabled: false
        image:
          repository: registry.france-nuage.fr/stripe/stripe-cli
          tag: "latest"
          pullPolicy: IfNotPresent
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "128Mi"
            cpu: "200m"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

operationWorker:
  enabled: true
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  replicas: 1
  config:
    logLevel: "info"
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"

synchronizer:
  enabled: true
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  replicas: 1
  config:
    logLevel: "info"
    rootOrganizationName: "acme"
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"

console:
  enabled: false
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  replicas: 1
  # Vide = anti-affinité zone preferred par défaut (console stateless).
  # Renseigner pour surcharger complètement le bloc affinity du pod.
  affinity: {}
  config:
    applicationMode: "rpc"
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"

keycloak:
  enabled: false
  image:
    repository: registry.france-nuage.fr/keycloak/keycloak
    tag: "26.0"
    pullPolicy: IfNotPresent
  replicas: 1
  config:
    importRealm: true
    hostnameStrict: true
    httpEnabled: false
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

systemTests:
  enabled: false
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  config:
    keycloakAdmin: "admin"
    keycloakAdminPassword: ""  
    oidcClientId: "francenuage"
    headless: true
    # Kubeconfig of the cluster the environment runs on. When set (billing CI),
    # the payment E2E enrols it as a hosting cluster so a paid deploy can resolve
    # a target. Empty => the deploy-cluster precondition is not wired.
    deployKubeconfig: ""
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  # Persists the Playwright HTML report on a shared volume and serves it through
  # an nginx deployment, so it stays reachable after the test pod exits (useful
  # to inspect traces/videos of a failed run). Enabled for CI environments.
  report:
    enabled: false
    storageClass: ""
    size: 1Gi
    image:
      repository: registry.france-nuage.fr/library/nginx
      tag: "stable-alpine"
      pullPolicy: IfNotPresent

migrations:
  atlas:
    enabled: true
    image:
      repository: registry.france-nuage.fr/arigaio/atlas
      tag: "latest"
      pullPolicy: IfNotPresent

  spicedb:
    enabled: true
    image:
      repository: registry.france-nuage.fr/authzed/zed
      tag: "latest"
      pullPolicy: IfNotPresent

# Internal DNS suffix served by the cluster (kubelet clusterDomain). Standard
# clusters use "cluster.local"; override when a cluster serves another zone
# (e.g. "qual.local" on qualif). Used to build in-cluster service FQDNs.
clusterDomain: cluster.local

# Pins the public Keycloak host to an in-cluster ingress IP via hostAliases on
# the backend deployments. Leave empty when the public OIDC URL is reachable
# from pods (prod, local). Set to the ingress controller ClusterIP on clusters
# where the hairpin does not resolve (e.g. qualif). See oidcHairpinHostAliases.
oidcHairpinIp: ""

ingress:
  baseDomain: ""
  # Optional environment id folded into a single host label for ephemeral
  # environments (e.g. "console--<envId>.<baseDomain>"). Empty in prod/local.
  envId: ""
  hostSeparator: "--"
  # When set, ingresses use this pre-existing TLS secret (a shared wildcard)
  # instead of requesting a per-host certificate from cert-manager. Empty in
  # prod/local, where cert-manager issues certificates via clusterIssuer.
  tlsSecretName: ""
  # Redirect HTTP to HTTPS at the ingress. Disable on qualif, where TLS is
  # terminated upstream (prod zero-trust) and forwarded as HTTP: keeping the
  # redirect on would loop indefinitely (ERR_TOO_MANY_REDIRECTS).
  sslRedirect: true
  className: nginx
  clusterIssuer: letsencrypt-prod
  monitoring: false
  annotations: {}
