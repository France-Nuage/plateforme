global:
  imageRegistry: registry.gitlab.com/getbunker-france-nuage/france-nuage/plateforme
  imageTag: "latest"
  imagePullPolicy: IfNotPresent

secrets:
  existingSecret: ""
  postgresPassword: ""
  spicedbPassword: ""
  spicedbPresharedKey: ""
  keycloakAdminPassword: ""
  workerToken: ""
  ciServiceToken: ""

postgres:
  enabled: true
  auth:
    database: postgres
    username: postgres
  # CloudNativePG : un seul Cluster héberge les 3 bases (controlplane sur `postgres`
  # via le superuser, + `keycloak` et `spicedb` dédiées). Voir templates/database/.
  cnpg:
    instances: 1
    imageTag: "16"
    storageClass: ""
    size: 10Gi
    podAntiAffinityType: preferred
    nodeAffinity: {}
    tolerations: []
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "500m"
    backup:
      enabled: false
      endpointURL: "https://s3-backup.france-nuage.fr"
      destinationPath: ""
      retentionPolicy: "30d"
      schedule: "0 40 3 * * *"
      s3:
        secretName: "cnpg-backup-s3-credentials"

spicedbDb:
  enabled: false
  image:
    repository: registry.france-nuage.fr/library/postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    database: spicedb
    username: spicedb
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"

keycloakDb:
  enabled: false
  image:
    repository: registry.france-nuage.fr/library/postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    database: keycloak
    username: keycloak
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"

spicedb:
  enabled: true
  image:
    repository: registry.france-nuage.fr/authzed/spicedb
    tag: "latest"
    pullPolicy: IfNotPresent
  useSharedDatabase: true
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

controlplane:
  enabled: true
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  replicas: 1
  config:
    addr: "0.0.0.0:80"
    logLevel: "info"
    rootOrganizationName: "acme"
    rootServiceAccountKey: "changeme"
    # Base64-encoded 32-byte key encrypting cluster kubeconfigs at rest.
    # Generate with: openssl rand -base64 32. Override in prod via the sealed secret.
    kubeconfigEncryptionKey: ""
    hoopApiKey: ""
    hoopApiUrl: "https://bastion.ssh.france-nuage.fr"
    deploymentLabels: ""
    deploymentAnnotations: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

operationWorker:
  enabled: true
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  replicas: 1
  config:
    logLevel: "info"
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"

synchronizer:
  enabled: true
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  replicas: 1
  config:
    logLevel: "info"
    rootOrganizationName: "acme"
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"

console:
  enabled: false
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  replicas: 1
  # Vide = anti-affinité zone preferred par défaut (console stateless).
  # Renseigner pour surcharger complètement le bloc affinity du pod.
  affinity: {}
  config:
    oidcClientId: "francenuage"
    oidcProviderName: "keycloak"
    applicationMode: "rpc"
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"

keycloak:
  enabled: false
  image:
    repository: registry.france-nuage.fr/keycloak/keycloak
    tag: "26.0"
    pullPolicy: IfNotPresent
  replicas: 1
  config:
    importRealm: true
    hostnameStrict: true
    httpEnabled: false
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

systemTests:
  enabled: false
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  config:
    keycloakAdmin: "admin"
    keycloakAdminPassword: ""  
    oidcClientId: "francenuage"
    headless: true
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

migrations:
  atlas:
    enabled: true
    image:
      repository: registry.france-nuage.fr/arigaio/atlas
      tag: "latest"
      pullPolicy: IfNotPresent

  spicedb:
    enabled: true
    image:
      repository: registry.france-nuage.fr/authzed/zed
      tag: "latest"
      pullPolicy: IfNotPresent

# Internal DNS suffix served by the cluster (kubelet clusterDomain). Standard
# clusters use "cluster.local"; override when a cluster serves another zone
# (e.g. "qual.local" on qualif). Used to build in-cluster service FQDNs.
clusterDomain: cluster.local

# Pins the public Keycloak host to an in-cluster ingress IP via hostAliases on
# the backend deployments. Leave empty when the public OIDC URL is reachable
# from pods (prod, local). Set to the ingress controller ClusterIP on clusters
# where the hairpin does not resolve (e.g. qualif). See oidcHairpinHostAliases.
oidcHairpinIp: ""

ingress:
  baseDomain: ""
  className: nginx
  clusterIssuer: letsencrypt-prod
  monitoring: false
  annotations: {}
