# France Nuage catalogue — single source of truth for Stripe billing.
#
# Every entry here generates Stripe products and prices; the Stripe `price_...`
# ids are produced by reconciliation (NOT declared here). Because this file is
# exhaustive, Stripe can be regenerated from it identically in production and in
# a test sandbox. Reconciliation only touches objects it owns (tagged
# `managed_by=france-nuage-catalog`), so it never affects unrelated Stripe data.
#
# Sections:
#   - managed_services: handpicked apps deployable via a Helm chart, shown in the
#     console.
#   - resources: bare Kubernetes resources billed by usage (no chart, hidden).
#   - legacy: historical VM "instance" products for not-yet-migrated customers
#     (no chart, hidden; retired as a block once no customer remains).
#
# Amounts are in cents (HT, excl. tax). lookup_key values are aligned with the
# keys already present in production so reconciliation reuses existing prices.

managed_services:
  - slug: gitlab-runner
    stripe_product_id: prod_T3eptu5GDvtXxA
    name: GitLab Runner
    description: >-
      Runners Kubernetes managés pour vos pipelines GitLab CI. BuildKit
      rootless, pas de Docker-in-Docker, isolation multi-tenant.
    category: automation
    deploy_target:
      availability: fr
    chart:
      name: gitlab-runner
      oci_reference: oci://registry.gitlab.com/getbunker-france-nuage/france-nuage/charts/gitlab-runner
    plans:
      - slug: gitlab-runner-standard
        name: GitLab Runner
        description: >-
          Runner CI/CD Kubernetes managé. BuildKit rootless, cache registry,
          isolation multi-tenant.
        highlighted: false
        requires_payment: true
        prices:
          - lookup_key: gitlab-managed-v1-monthly
            unit_amount_cents: 5000
            currency: eur
            interval: month
        entitlements:
          - { key: buildkit, label: Build, value: BuildKit rootless sécurisé }
          - { key: multiplatform, label: Plateformes, value: Builds multi-plateformes }
          - { key: cache, label: Cache, value: Cache registry intégré }
          - { key: isolation, label: Isolation, value: Multi-tenant }

