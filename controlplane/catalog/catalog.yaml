        highlighted: true
        requires_payment: true
        prices:
          - lookup_key: postgresql-managed-nano-v1-monthly
            unit_amount_cents: 5000
            currency: eur
            interval: month
            nickname: nano
        entitlements:
          - { key: hosting, label: Hébergement, value: "France, conforme RGPD" }
          - { key: backup, label: Sauvegarde, value: "Continue (PITR)" }
          - { key: monitoring, label: Monitoring, value: "24/7" }

