service:
  slug: metabase
  name: Metabase
  description: |
    Outil de Business Intelligence open source. Creez des dashboards
    et explorez vos donnees sans SQL.
  category: analytics
  database_engine: cnpg
  icon_url: null
  # Labels qu'un cluster doit porter pour heberger ce service (voir
  # kubernetes.label) ; sans deploy_target le service ne peut pas etre deploye.
  deploy_target:
    availability: ft

plans:
  - id: metabase-standard
    name: "Metabase Standard"
    description: "Dashboards illimites, support email."
    status: active
    highlighted: true
    entitlements:
      - key: support_level
        label: "Support"
        value: "Email"
      - key: gti
        label: "Temps d'intervention garanti"
        value: "24h"
    prices:
      monthly: 1499
      yearly: 16189

dev_mock_version:
  chart_version: 1.0.0
  app_version: 0.60.4
  oci_reference: oci://registry.gitlab.com/getbunker-france-nuage/france-nuage/charts/metabase
  configurable_values_schema:
    $schema: "http://json-schema.org/draft-07/schema#"
    type: object
    required: [domain]
    properties:
      domain:
        type: string
        format: hostname
        title: Domaine
        description: "Nom de domaine sur lequel l'instance sera accessible."
  ui_schema:
    "ui:order": [domain]
    domain:
      "ui:placeholder": bi.monorga.com
      "ui:description": "Doit pointer vers les IPs France Nuage (A / CNAME). Le SMTP se configure directement dans l'interface Metabase."
