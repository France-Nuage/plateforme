[workspace]

members = [
  "auth",
  "frn-core",
  "frn-crypto",
  "frn-derive",
  "frn-rpc",
  "database",
  "database-core",
  "derive-auth",
  "derive_factory",
  "derive_repository",
  "infrastructure",
  "mock_server",
  "server",
  "spicedb",
  "synchronizer",
  "hoop",
  "worker",
  "workflow",
  "workflow-macros",
]

resolver = "3"

[workspace.dependencies]
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
fabrique = "0.2"
fake = { version = "4", features = ["derive", "serde_json"] }
serde_json = "1"
sqlx = { version = "0.9.0-alpha.1", features = [
  "chrono",
  "macros",
  "postgres",
  "runtime-tokio",
  "uuid",
] }
k8s-openapi = { version = "0.24" }
kube = { version = "0.98", features = ["client"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }
