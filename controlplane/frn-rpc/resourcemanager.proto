syntax = "proto3";

package francenuage.fr.resourcemanager.v1;

import "google/protobuf/timestamp.proto";
import "validate.proto";

service Organizations {
    rpc List (ListOrganizationsRequest) returns (ListOrganizationsResponse);
    rpc Create (CreateOrganizationRequest) returns (CreateOrganizationResponse);
}

service Projects {
    rpc List (ListProjectsRequest) returns (ListProjectsResponse);
    rpc Create (CreateProjectRequest) returns (CreateProjectResponse);
}

message Organization {
    string slug = 5 [(validate.rules).string = {
        min_len: 1,
        max_len: 49,
        pattern: "^[a-zA-Z]([a-zA-Z-]*[a-zA-Z])?$"
    }];
    string name = 2 [(validate.rules).string = {
        min_len: 1,
        max_len: 64,
        pattern: "^[a-zA-Z0-9_\\- ]+$"
    }];
    google.protobuf.Timestamp created_at = 3;
    google.protobuf.Timestamp updated_at = 4;
    // Field 1 (id) removed: slug is the primary identifier.
    reserved 1;
    reserved "id";
}

message Project {
    string slug = 6 [(validate.rules).string = {
        min_len: 1,
        max_len: 49,
        pattern: "^[a-zA-Z]([a-zA-Z-]*[a-zA-Z])?$"
    }];
    string name = 2 [(validate.rules).string = {
        min_len: 1,
        max_len: 64,
        pattern: "^[a-zA-Z0-9_\\- ]+$"
    }];
    string organization_slug = 7 [(validate.rules).string = {
        min_len: 1,
        max_len: 49,
        pattern: "^[a-zA-Z]([a-zA-Z-]*[a-zA-Z])?$"
    }];
    google.protobuf.Timestamp created_at = 4;
    google.protobuf.Timestamp updated_at = 5;
    // Fields 1 (id) and 3 (organization_id) removed: slug-based identifiers.
    reserved 1, 3;
    reserved "id", "organization_id";
}

message ListOrganizationsRequest {}

message ListOrganizationsResponse {
    repeated Organization organizations = 1;
}

message CreateOrganizationRequest {
    string name = 1 [(validate.rules).string = {
        min_len: 1,
        max_len: 64,
        pattern: "^[a-zA-Z0-9_\\- ]+$"
    }];
    optional string parent_slug = 3 [(validate.rules).string = {
        min_len: 1,
        max_len: 49,
        pattern: "^[a-zA-Z]([a-zA-Z-]*[a-zA-Z])?$"
    }];
    // Field 2 (parent_id) removed.
    reserved 2;
    reserved "parent_id";
}

message CreateOrganizationResponse {
    Organization organization = 1;
}

message ListProjectsRequest {}

message ListProjectsResponse {
    repeated Project projects = 1;
}

message CreateProjectRequest {
    string name = 1 [(validate.rules).string = {
        min_len: 1,
        max_len: 64,
        pattern: "^[a-zA-Z0-9_\\- ]+$"
    }];
    string organization_slug = 3 [(validate.rules).string = {
        min_len: 1,
        max_len: 49,
        pattern: "^[a-zA-Z]([a-zA-Z-]*[a-zA-Z])?$"
    }];
    // Field 2 (organization_id) removed.
    reserved 2;
    reserved "organization_id";
}

message CreateProjectResponse {
    Project project = 1;
}
