[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stripe-webhook = { version = "1.0.0-rc.6", features = ["async-stripe-checkout", "async-stripe-billing"] }
axum = "0.8"
bytes = "1"
frn-core = { path = "../frn-core" }
frn-crypto = { path = "../frn-crypto" }
frn-rpc = { path = "../frn-rpc" }
chrono = "0.4"
http = "1"
http-body = "1"
hyper = "1"
infrastructure = { path = "../infrastructure" }
jsonwebtoken = "9"
mock_server = { path = "../mock_server" }
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
spicedb = { path = "../spicedb" }
sqlx = { workspace = true, features = ["migrate"] }
thiserror = "2"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal"] }
tokio-stream = "0.1.17"
tonic = "0.14"
tonic-health = "0.14"
tonic-reflection = "0.14"
tonic-web = "0.14"
tower = "0.5"
tower-http = { version = "0.6", features = ["auth", "cors", "trace"] }
tower-layer = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
workflow = { path = "../workflow" }

[dev-dependencies]
async-trait = "0.1"
auth = { path = "../auth", features = ["mock"] }
chrono = "0.4"
database = { path = "../database" }
fabrique = { workspace = true }
frn-crypto = { path = "../frn-crypto" }
hypervisor = { path = "../hypervisor", features = ["mock"] }
kube = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
uuid = { workspace = true }
workflow = { path = "../workflow" }
