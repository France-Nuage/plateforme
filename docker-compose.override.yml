services:
  controlplane:
    build:
      args:
        RUST_BASE_IMAGE: rust:1.90-alpine
        ALPINE_BASE_IMAGE: alpine:3.23
    volumes: !override
      - ./controlplane:/app
      - /app/target
      - bff_secret:/shared
      - ./certs/ca.pem:/usr/local/share/ca-certificates/docker-compose-dev-ca.crt:ro
    extra_hosts: !reset
      - "auth.test:host-gateway"
      - "iam.test:host-gateway"
      - "console.test:host-gateway"
      - "controlplane.test:host-gateway"
    environment:
      OIDC_URL: https://auth.test/realms/france-nuage/.well-known/openid-configuration

  worker:
    build:
      args:
        RUST_BASE_IMAGE: rust:1.90-alpine
        ALPINE_BASE_IMAGE: alpine:3.23
    extra_hosts:
      - "kubernetes.zero-trust.tartrau.fr:192.168.1.50"
    environment:
      HELM_REGISTRY_USER: ${HELM_REGISTRY_USER}
      HELM_REGISTRY_TOKEN: ${HELM_REGISTRY_TOKEN}
    entrypoint: ["sh", "-c", "echo ${HELM_REGISTRY_TOKEN} | helm registry login registry.gitlab.com -u ${HELM_REGISTRY_USER} --password-stdin 2>&1; exec cargo run --bin=worker"]

  synchronizer:
    build:
      args:
        RUST_BASE_IMAGE: rust:1.90-alpine
        ALPINE_BASE_IMAGE: alpine:3.23

  console:
    build:
      args:
        NODE_BASE_IMAGE: node:22-alpine
        NGINX_BASE_IMAGE: nginx:1.27-alpine

  node-sdk:
    build:
      args:
        NODE_BASE_IMAGE: node:22-alpine

  spicedb:
    ports: !reset
      - "60051:50051"
      - "18443:8443"

  postgres:
    ports: !reset
      - "15432:5432"

  spicedb-datastore:
    ports: !reset
      - "15433:5432"
