# template buildkit
.buildkit_template:
  image: registry.france-nuage.fr/library/docker:29
  services: []
  # Le GitLab Container Registry renvoie par intermittence "blob unknown to
  # registry" lors du push d'images volumineuses (blobs de couche pas encore
  # committés côté registry au moment du montage). C'est transitoire : on
  # relance le job jusqu'à deux fois, en couvrant aussi bien les échecs
  # d'infrastructure du runner que l'échec de script du "docker buildx build".
  retry:
    max: 2
    when:
      - runner_system_failure
      - script_failure
      - stuck_or_timeout_failure
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - |
      cat > /tmp/buildkitd.toml <<'EOF'
      [registry."docker.io"]
        mirrors = ["registry.france-nuage.fr"]
      EOF
    - |
      docker buildx create \
        --driver=kubernetes \
        --driver-opt=namespace=${BUILDKIT_NAMESPACE:-${KUBE_CI_NAMESPACE_NAME}} \
        --driver-opt=rootless=true \
        --driver-opt=image=registry.france-nuage.fr/moby/buildkit:rootless \
        --driver-opt=replicas=1 \
        --driver-opt=requests.cpu=2 \
        --driver-opt=requests.memory=2Gi \
        --driver-opt=limits.cpu=8 \
        --driver-opt=limits.memory=8Gi \
        --buildkitd-config=/tmp/buildkitd.toml \
        --name=k8s-builder-${CI_JOB_ID} \
        --use
    - docker buildx inspect --bootstrap
    - sleep 5
  after_script:
    - docker buildx rm k8s-builder-${CI_JOB_ID} || true

.build_template: &build_template
  stage: build
  variables:
    TARGET: development

.helm_template:
  image: alpine/helm:latest
  services: []
  before_script:
    - apk add --no-cache kubectl
    - echo "$KUBECONFIG_PROD_BASE64" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
    - kubectl version --client
    - helm version

.helm_prod_template:
  image: registry.france-nuage.fr/library/debian:bookworm-slim
  services: []
  interruptible: false
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates proxychains-ng
    - curl -LO "https://dl.k8s.io/release/v1.32.4/bin/linux/amd64/kubectl" && chmod +x kubectl && mv kubectl /usr/local/bin/
    - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    - curl -fsSL https://tailscale.com/install.sh | sh
    - "tailscaled --tun=userspace-networking --socks5-server=localhost:1055 --state=mem: &"
    - sleep 5
    - tailscale up --login-server=${TAILSCALE_LOGIN_SERVER} --authkey ${TAILSCALE_K8S_AUTHKEY} --accept-routes
    - echo -e "[ProxyList]\nsocks5 127.0.0.1 1055" > /etc/proxychains4.conf
    - echo "$KUBECONFIG_PROD_BASE64" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig

# Deploys to the qualification cluster. KUBECONFIG_QUALIF is a File-type CI
# variable, exposed as KUBECONFIG so kubectl/helm pick it up automatically.
.helm_qualif_template:
  image: registry.france-nuage.fr/dtzar/helm-kubectl:4.2.2
  services: []
  variables:
    KUBECONFIG: $KUBECONFIG_QUALIF
  before_script:
    - kubectl version --client
    - helm version
