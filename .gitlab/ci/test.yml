"unit tests / authz":
  stage: unit-tests
  image: registry.france-nuage.fr/library/alpine:latest
  services: []
  needs: []
  before_script:
    - apk add --no-cache wget
    - wget https://github.com/authzed/zed/releases/download/v0.34.1/zed_0.34.1_linux_amd64.apk
    - apk add --allow-untrusted zed_0.34.1_linux_amd64.apk
  script:
    - cd authz
    - zed validate tests.yaml
  rules:
    - changes:
        - authz/**/*
        - .gitlab-ci.yml

"unit tests / migration linting":
  stage: unit-tests
  image:
    name: registry.france-nuage.fr/arigaio/atlas@sha256:591872655a7758a60edcb6a23e60caee2fd3ae3fb08bceb8bc4e095f6d5013b5
    entrypoint: [""]
  needs: []
  services:
    - name: registry.france-nuage.fr/library/postgres:16-alpine
      alias: atlas-dev-database
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
    POSTGRES_PASSWORD: postgres
    POSTGRES_USER: postgres
    POSTGRES_DB: test
  before_script:
    - apk add --no-cache git
  script:
    - |
      atlas migrate lint \
        --dev-url="postgres://postgres:postgres@atlas-dev-database:5432/test?sslmode=disable" \
        --dir="file://controlplane/migrations" \
        --git-base=origin/master
  rules:
    - changes:
        - controlplane/migrations/**/*
        - .gitlab-ci.yml

"unit tests / controlplane":
  stage: unit-tests
  image: registry.france-nuage.fr/library/rust:1.90-alpine
  needs: []
  services:
    - name: registry.france-nuage.fr/library/postgres:16-alpine
      alias: test-postgres
  variables:
    CARGO_INCREMENTAL: "0"
    SQLX_OFFLINE: "true"
    POSTGRES_PASSWORD: postgres
    POSTGRES_USER: postgres
    POSTGRES_DB: test
    DATABASE_URL: "postgres://postgres:postgres@test-postgres:5432/test"
    KUBERNETES_CPU_LIMIT: "8000m"
    KUBERNETES_MEMORY_LIMIT: "20480Mi"
  before_script:
    - apk add --no-cache musl-dev openssl-dev openssl-libs-static protobuf-dev
    - cd controlplane
  script:
    - cargo test --workspace --all-features
  rules:
    - changes:
        - controlplane/**/*
        - .gitlab-ci.yml

# End-to-end tests for the Kubernetes operations. They only talk to the API
# server (namespaces, secrets), so a bare kube-apiserver + etcd (the envtest
# assets, plain processes) is enough: no node, no privileged container, no DinD.
# The image MUST be glibc-based (the envtest binaries are glibc-linked); the
# alpine rust image used above cannot run them.
"e2e k8s / controlplane":
  stage: unit-tests
  image: registry.france-nuage.fr/library/rust:1.90-slim-bookworm
  needs: []
  variables:
    CARGO_INCREMENTAL: "0"
    SQLX_OFFLINE: "true"
    ENVTEST_K8S_VERSION: "1.31.0"
    E2E_SUFFIX: "$CI_JOB_ID"
    KUBEBUILDER_ASSETS: /tmp/controller-tools/envtest
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl ca-certificates openssl bash protobuf-compiler libprotobuf-dev pkg-config libssl-dev
    - curl -fsSL "https://github.com/kubernetes-sigs/controller-tools/releases/download/envtest-v${ENVTEST_K8S_VERSION}/envtest-v${ENVTEST_K8S_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
    - cd controlplane
  script:
    - ./scripts/run-with-envtest.sh cargo test -p workflow --test kubernetes_operations -- --ignored
  rules:
    - changes:
        - controlplane/**/*
        - .gitlab-ci.yml
