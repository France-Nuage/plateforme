# Ephemeral environments deployed on the qualification cluster. test-env is
# redeployed cleanly each pipeline to run the system tests, then torn down;
# review-env is deployed on demand and kept until it expires or its MR closes.
# Each environment lives in a frn-ci-<pipeline> namespace labelled for the
# scheduled garbage collector (see scheduled.yml); the control plane propagates
# those labels to the managed service namespaces it creates (DEPLOYMENT_LABELS).

.ci_env_variables:
  variables:
    # Hosts are flattened to a single label (console--<pipeline>.qual.apps...) so
    # the shared *.qual.apps wildcard certificate covers them; a wildcard only
    # matches one level, hence the "--" separator instead of a dot.
    BASE_DOMAIN: "qual.apps.france-nuage.fr"
    # Environment identifier. Defaults to the pipeline id (review-env); test-env
    # overrides it with the branch slug (see its resource_group below).
    ENV_ID: "${CI_PIPELINE_ID}"
    RELEASE_NAME: plateforme
    # Shared wildcard certificate reused by every ephemeral environment.
    WILDCARD_TLS_NAMESPACE: "france-nuage-system"
    WILDCARD_TLS_SECRET: "wildcard-qual-apps-tls"
    # Single source of truth for the ephemeral environment lifetime. Environments
    # are normally torn down when the MR merges or closes (on_stop); this TTL is
    # only the safety net for the scheduled garbage collector.
    CI_ENV_TTL_SECONDS: "604800"

.deploy_ci_env:
  extends:
    - .helm_qualif_template
    - .ci_env_variables
  script:
    - |
      set -e

      # Stripe billing is opt-in: only wire it up when both protected variables
      # are present. Absent them (e.g. forks, or pipelines without the protected
      # scope), the stack deploys billing-off and the payment E2E is skipped —
      # every billing block in the chart is guarded by both keys being set.
      STRIPE_HELM_ARGS=""
      if [ -n "${STRIPE_SECRET_KEY:-}" ] && [ -n "${STRIPE_WEBHOOK_SECRET:-}" ]; then
        echo "Stripe billing enabled for this environment."
        STRIPE_HELM_ARGS="--set-string secrets.stripeSecretKey=${STRIPE_SECRET_KEY} --set-string secrets.stripeWebhookSecret=${STRIPE_WEBHOOK_SECRET}"
        # The payment E2E enrols a hosting cluster so a paid deploy can resolve a
        # target. Reuse this job's kubeconfig verbatim — the very one that already
        # deploys the whole environment on qualif (client cert + tls-server-name),
        # so both the control plane's health check and the worker's helm install
        # use working credentials. No transformation: rewriting the server or CA
        # only breaks the TLS server-name pinning the kubeconfig relies on.
        STRIPE_HELM_ARGS="${STRIPE_HELM_ARGS} --set-file systemTests.config.deployKubeconfig=${KUBECONFIG}"
      else
        echo "Stripe billing disabled (STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET not set); the payment E2E will be skipped."
      fi

      # Charts registry read credentials: let the control plane discover
      # deployable chart versions from the OCI registry at startup. Without them,
      # discovery is skipped and no managed service is deployable — so the
      # deployment E2E needs them. Injected from protected CI variables.
      REGISTRY_HELM_ARGS=""
      if [ -n "${CHARTS_REGISTRY_USER:-}" ] && [ -n "${CHARTS_REGISTRY_TOKEN:-}" ]; then
        echo "Charts registry discovery enabled for this environment."
        REGISTRY_HELM_ARGS="--set-string secrets.chartsRegistryUser=${CHARTS_REGISTRY_USER} --set-string secrets.chartsRegistryToken=${CHARTS_REGISTRY_TOKEN}"
      else
        echo "Charts registry credentials not set; chart-version discovery will be skipped."
      fi

      # Start from a clean slate: the environment is keyed by branch and reused
      # across runs, so a previous run can leave persistent state behind
      # (PersistentVolumeClaims for Postgres/SpiceDB/Keycloak). That state can rot
      # — e.g. a CNPG volume going read-only — and a plain `helm upgrade` over it
      # cannot recover. Delete any existing namespace and wait for it to be fully
      # gone (PVCs included) before recreating, so every run deploys fresh.
      if kubectl get namespace "${NAMESPACE}" >/dev/null 2>&1; then
        echo "Deleting stale environment ${NAMESPACE} before redeploying..."
        kubectl delete namespace "${NAMESPACE}" --wait=true --timeout=5m || true
      fi

      kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply --validate=false -f -
      kubectl label namespace "${NAMESPACE}" --overwrite \
        frn.ci/managed=true \
        frn.ci/pipeline-id="${CI_PIPELINE_ID}" \
        frn.ci/mr-iid="${CI_MERGE_REQUEST_IID:-none}"
      kubectl annotate namespace "${NAMESPACE}" --overwrite \
        frn.ci/expires-at="$(date -u -d "@$(( $(date -u +%s) + ${CI_ENV_TTL_SECONDS} ))" +%Y-%m-%dT%H:%M:%SZ)"

      # Reuse the shared *.qual.apps wildcard certificate instead of issuing one
      # per environment: this avoids Let's Encrypt rate limits (50 certs/week per
      # registered domain) and removes the DNS-01 wait from the critical path.
      # Recreate the secret from its cert material (via create --dry-run | apply)
      # to drop the source secret's namespace-bound and owner metadata.
      kubectl get secret "${WILDCARD_TLS_SECRET}" -n "${WILDCARD_TLS_NAMESPACE}" \
        -o jsonpath='{.data.tls\.crt}' | base64 -d > /tmp/wildcard.crt
      kubectl get secret "${WILDCARD_TLS_SECRET}" -n "${WILDCARD_TLS_NAMESPACE}" \
        -o jsonpath='{.data.tls\.key}' | base64 -d > /tmp/wildcard.key
      # --validate=false skips the cluster OpenAPI download, which is not needed
      # for a plain TLS secret and occasionally times out on the qualif API server.
      kubectl create secret tls "${WILDCARD_TLS_SECRET}" \
        --cert=/tmp/wildcard.crt --key=/tmp/wildcard.key \
        -n "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply --validate=false -f -
      rm -f /tmp/wildcard.crt /tmp/wildcard.key

      # Résolution du tag d'image par composant (issue #8040).
      #
      # Le déploiement épinglait `global.imageTag=<slug>-release` pour TOUS les
      # composants France-Nuage. Or les jobs `build / … / release` sont gardés par
      # `changes:` : sur une MR partielle (qui ne touche pas tous les composants),
      # seules les images des composants modifiés sont poussées sous ce tag. Les
      # autres n'ont aucune image `<slug>-release` → `helm upgrade` tire un tag
      # inexistant → « Progress deadline exceeded » (le déploiement échouait donc
      # sur toute MR ne reconstruisant pas l'intégralité du stack).
      #
      # Correctif : on prend `master-release` (jeu complet issu du dernier build de
      # master) comme socle, et on ne surcharge au tag `<slug>-release` que les
      # composants dont l'image a effectivement été (re)construite sur cette branche
      # — détecté en interrogeant le registre. Un composant non reconstruit reste
      # sur son image master, exactement l'état attendu pour une MR qui ne le touche
      # pas. Chaque composant garde ainsi une image existante et déployable.
      RELEASE_TAG="${CI_COMMIT_REF_SLUG}-release"
      REGISTRY_REPO_PATH="${CI_REGISTRY_IMAGE#*/}"
      COMPONENT_TAG_ARGS=""
      # Correspondance « nom d'image (registre) : clé de valeur Helm » pour les
      # composants FN dont le tag dérive de global.imageTag (image.tag vide).
      for mapping in \
        "controlplane:controlplane" \
        "operation-worker:operationWorker" \
        "synchronizer:synchronizer" \
        "console:console" \
        "system-tests:systemTests"; do
        image_name="${mapping%%:*}"
        value_key="${mapping##*:}"
        repo="${REGISTRY_REPO_PATH}/${image_name}"
        token="$(curl -sS -u "${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD}" \
          "https://${CI_SERVER_HOST}/jwt/auth?service=container_registry&scope=repository:${repo}:pull" \
          | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')" || true
        http_code="$(curl -sS -o /dev/null -w '%{http_code}' \
          -H "Authorization: Bearer ${token}" \
          -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
          -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
          -H "Accept: application/vnd.oci.image.index.v1+json" \
          "https://${CI_REGISTRY}/v2/${repo}/manifests/${RELEASE_TAG}")" || true
        if [ "${http_code}" = "200" ]; then
          echo "Image ${image_name}:${RELEASE_TAG} présente → surcharge ${value_key}.image.tag."
          COMPONENT_TAG_ARGS="${COMPONENT_TAG_ARGS} --set ${value_key}.image.tag=${RELEASE_TAG}"
        else
          echo "Image ${image_name}:${RELEASE_TAG} absente (HTTP ${http_code:-000}) → fallback master-release."
        fi
      done

      # Hairpin OIDC — résolution DYNAMIQUE de la ClusterIP d'ingress (#8042 / FRA-29).
      #
      # Au bootstrap, le control plane résout l'issuer Keycloak *public*
      # (server/src/config.rs → OpenID::discover). Cette URL publique ne reboucle
      # jamais vers l'ingress depuis l'intérieur du cluster de qualif : le chart
      # épingle donc l'hôte Keycloak sur la ClusterIP du contrôleur d'ingress via
      # un hostAlias (`oidcHairpinIp`, cf. _helpers.tpl → oidcHairpinHostAliases).
      # Figer cette IP dans values-ci.yaml POURRIT : le Service d'ingress reçoit
      # une nouvelle ClusterIP à chaque reprovisionnement, et un pin périmé
      # (192.168.250.128) envoie la découverte OIDC dans le vide → controlplane en
      # CrashLoopBackOff sur OpenID::discover → deploy/test-env ROUGE sur toute MR.
      #
      # Le job deploy dispose déjà d'un kubeconfig cluster-admin sur la qualif : on
      # résout ici la ClusterIP vivante et on surcharge le pin. Cela s'auto-répare
      # à chaque reprovisionnement et supprime la valeur codée en dur comme source
      # de dérive. On dump d'abord les services candidats (visible en ~1 min) : si
      # la résolution échoue, la vraie donnée reste tracée sans attendre le timeout
      # helm de 15 min pour lire le post-mortem.
      echo "----- services candidats pour le hairpin OIDC (#8042) -----"
      kubectl get svc -A -o wide 2>&1 | grep -iE "ingress|kingress|traefik|nginx|nodeport" || true

      OIDC_HAIRPIN_ARGS=""
      # Table BRUTE « <ns>/<nom> <clusterIP> <ports…> » de TOUS les services. On ne
      # pré-filtre PAS par « ingress » dans le nom : sur ce cluster le contrôleur
      # d'ingress est `kube-system/traefik`, dont le nom ne contient pas « ingress »
      # — un `grep -iE 'ingress'` ne matchait rien, la substitution de commande
      # sortait en 1, et sous `set -e` le job MOURAIT ici (avant même helm). On
      # capture donc la table entière (kubectl seul, jamais un grep en fin de pipe)
      # puis on sélectionne en awk, ce qui ne peut pas avorter le job.
      INGRESS_SVC_TABLE="$(kubectl get svc -A \
        -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{" "}{.spec.clusterIP}{" "}{.spec.ports[*].port}{"\n"}{end}' 2>/dev/null || true)"
      # Sélection par SCORE du contrôleur d'ingress qui sert l'issuer OIDC public.
      # On ne devine pas par le nom seul (fragile) : on note chaque Service et on
      # retient le mieux classé.
      #   - filtre dur : ClusterIP réelle + exposition du 443 (l'issuer OIDC est en
      #     https ; le hairpin DOIT router le 443) ;
      #   - exclusions : services annexes (webhook/admission/metrics/default-backend/
      #     canary) et namespaces `managed-*` (workloads clients type pangolin, pas
      #     le chemin de données de l'ingress de la plateforme) ;
      #   - bonus : exposition conjointe du 80, namespace système d'ingress
      #     (kube-system/ingress-nginx/traefik/…), nom de contrôleur connu
      #     (traefik/nginx/ingress/contour/haproxy/kingress).
      # Ainsi `kube-system/traefik` (80+443) l'emporte sur un éventuel
      # `managed-*/pangolin-traefik-nodeport` sans coder d'IP en dur.
      INGRESS_HAIRPIN_IP="$(printf '%s\n' "${INGRESS_SVC_TABLE}" | awk '
        $2!="" && $2!="None" {
          split($1, a, "/"); ns=a[1]; name=a[2];
          if (name ~ /admission|webhook|metrics|default-backend|canary/) next;
          if (ns ~ /^managed-/) next;
          has80=0; has443=0;
          for (i=3; i<=NF; i++) { if ($i==80) has80=1; if ($i==443) has443=1 }
          if (!has443) next;
          score=1;
          if (has80) score+=2;
          if (ns ~ /^(kube-system|ingress-nginx|ingress|traefik|kingress)$/) score+=4;
          if (name ~ /ingress|traefik|nginx|kingress|contour|haproxy/) score+=2;
          if (score>best) { best=score; ip=$2 }
        }
        END { if (best>0) print ip }')"
      if [ -n "${INGRESS_HAIRPIN_IP}" ]; then
        echo "Hairpin OIDC : ClusterIP d'ingress découverte = ${INGRESS_HAIRPIN_IP} (surcharge oidcHairpinIp)."
        OIDC_HAIRPIN_ARGS="--set oidcHairpinIp=${INGRESS_HAIRPIN_IP}"
      else
        echo "Hairpin OIDC : aucune ClusterIP d'ingress découverte ; conservation de la valeur épinglée dans values-ci.yaml."
      fi

      # On désactive `set -e` le temps du déploiement pour capturer le code de
      # sortie de helm : en cas d'échec (typiquement « Progress deadline
      # exceeded », qui ne dit PAS quel pod ni pourquoi), on veut d'abord vider
      # l'état du cluster dans le log avant de propager l'échec. Sans ça, la
      # trace CI ne contient aucun événement, statut de pod ni log applicatif —
      # le namespace éphémère est détruit juste après, le diagnostic est perdu,
      # et chaque échec de deploy repart d'une boîte noire.
      set +e
      helm upgrade --install "${RELEASE_NAME}" ./helm/plateforme \
        --namespace "${NAMESPACE}" \
        --values ./helm/plateforme/values-ci.yaml \
        --set global.imageRegistry=${CI_REGISTRY_IMAGE} \
        --set global.imageTag=master-release \
        ${COMPONENT_TAG_ARGS} \
        ${OIDC_HAIRPIN_ARGS} \
        --set global.imagePullPolicy=Always \
        --set ingress.baseDomain="${BASE_DOMAIN}" \
        --set ingress.envId="${ENV_ID}" \
        --set ingress.hostSeparator="--" \
        --set ingress.tlsSecretName="${WILDCARD_TLS_SECRET}" \
        --set secrets.postgresPassword="postgres" \
        --set secrets.spicedbPassword="spicedb_password" \
        --set secrets.spicedbPresharedKey="${SPICEDB_TOKEN}" \
        --set secrets.keycloakAdminPassword="admin" \
        --set controlplane.config.rootServiceAccountKey="ci-root-sa-key" \
        --set controlplane.config.kubeconfigEncryptionKey="Y2ktZW5jcnlwdGlvbi1rZXktMzItYnl0ZXMtcGFkISE=" \
        --set secrets.workerToken="ci-worker-token" \
        --set secrets.ciServiceToken="ci-service-token" \
        --set-string controlplane.config.deploymentLabels="frn.ci/managed=true\,frn.ci/pipeline-id=${CI_PIPELINE_ID}" \
        ${STRIPE_HELM_ARGS} \
        ${REGISTRY_HELM_ARGS} \
        ${HELM_EXTRA_ARGS:-} \
        --wait \
        --timeout 15m
      deploy_rc=$?
      set -e

      if [ "${deploy_rc}" -ne 0 ]; then
        echo "=================================================================="
        echo "Le déploiement a échoué (helm rc=${deploy_rc}). Diagnostic cluster :"
        echo "=================================================================="
        echo "----- Événements du namespace (ordre chronologique, 80 derniers) -----"
        kubectl get events -n "${NAMESPACE}" --sort-by=.lastTimestamp 2>&1 | tail -n 80 || true
        echo "----- Vue d'ensemble des workloads -----"
        kubectl get pods,deployment,statefulset,job -n "${NAMESPACE}" -o wide 2>&1 || true
        echo "----- Détail par pod (describe + logs courants et précédents) -----"
        for pod in $(kubectl get pods -n "${NAMESPACE}" \
          -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
          echo "########## describe ${pod} ##########"
          kubectl describe pod "${pod}" -n "${NAMESPACE}" 2>&1 | tail -n 45 || true
          echo "########## logs ${pod} (courant, 80 dernières) ##########"
          kubectl logs "${pod}" -n "${NAMESPACE}" --all-containers --tail=80 2>&1 || true
          echo "########## logs ${pod} (précédent, si crash-loop) ##########"
          kubectl logs "${pod}" -n "${NAMESPACE}" --all-containers --previous --tail=80 2>&1 || true
        done
        echo "=================================================================="
        echo "Fin du diagnostic — propagation de l'échec (rc=${deploy_rc})."
        echo "=================================================================="
        exit "${deploy_rc}"
      fi

.cleanup_ci_env:
  extends: .helm_qualif_template
  script:
    # Delete the environment's namespace directly. Using ${NAMESPACE} (keyed by
    # branch slug for test-env, by pipeline id for review-env) is robust even when
    # a later run redeployed the namespace: we always target the right one,
    # whereas a pipeline-id label selector could miss a namespace last written by
    # a different pipeline of the same branch.
    - kubectl delete namespace "${NAMESPACE}" --ignore-not-found --wait=false || true

"deploy / test-env":
  extends: .deploy_ci_env
  stage: deploy
  # Keyed by branch slug, not pipeline id: at most one test environment per
  # branch (runs don't stack up and exhaust the cluster). The deploy step drops
  # any existing namespace first and recreates it from scratch, so each run
  # starts on a clean slate — no rotten persistent state carried over. The
  # resource_group serialises concurrent runs of the same branch so the drop and
  # recreate never race another pipeline on the same namespace.
  resource_group: "test-env-${CI_COMMIT_REF_SLUG}"
  variables:
    ENV_ID: "${CI_COMMIT_REF_SLUG}"
    NAMESPACE: "frn-ci-test-${CI_COMMIT_REF_SLUG}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

"system tests / kubernetes":
  extends:
    - .helm_qualif_template
    - .ci_env_variables
  stage: system-tests
  needs:
    - job: "deploy / test-env"
      artifacts: false
  variables:
    ENV_ID: "${CI_COMMIT_REF_SLUG}"
    NAMESPACE: "frn-ci-test-${CI_COMMIT_REF_SLUG}"
  environment:
    name: "report/${CI_COMMIT_REF_SLUG}"
    url: "https://report--${CI_COMMIT_REF_SLUG}.qual.apps.france-nuage.fr"
    on_stop: "cleanup / test-env"
    auto_stop_in: 1 week
  script:
    - |
      JOB="${RELEASE_NAME}-system-tests"
      kubectl logs -n "${NAMESPACE}" -f job/"${JOB}" --pod-running-timeout=10m 2>&1 | tee system-tests-logs.txt || true
      RESULT=0
      # 10m (was 5m): the Stripe payment E2E adds a hosted-checkout round trip
      # plus the asynchronous webhook -> subscription activation -> instance
      # provisioning chain, which the shorter budget could clip on a busy runner.
      kubectl wait -n "${NAMESPACE}" job/"${JOB}" --for=condition=complete --timeout=10m \
        && echo "System tests passed" \
        || { echo "System tests failed"; RESULT=1; }

      # Free cluster resources but keep the report server (and its volume) so the
      # Playwright report stays reachable until the environment is stopped. Delete
      # the application deployments (the report deployment and its PVC survive).
      echo "Removing application workloads, keeping the report server..."
      kubectl delete deployment,statefulset -n "${NAMESPACE}" \
        -l app.kubernetes.io/instance="${RELEASE_NAME}",app.kubernetes.io/component!=system-tests-report \
        --ignore-not-found || true
      echo "Report available at https://report--${ENV_ID}.qual.apps.france-nuage.fr"

      exit ${RESULT}
  artifacts:
    when: always
    paths:
      - system-tests-logs.txt
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

"cleanup / test-env":
  extends: .cleanup_ci_env
  stage: cleanup
  environment:
    name: "report/${CI_COMMIT_REF_SLUG}"
    action: stop
  needs:
    - job: "deploy / test-env"
      artifacts: false
    - job: "system tests / kubernetes"
      artifacts: false
      optional: true
  # Stops the report environment: triggered on demand, when the MR merges/closes,
  # or by auto_stop_in. Not run automatically so the report survives the pipeline.
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true

"deploy / review-env":
  extends: .deploy_ci_env
  stage: deploy
  resource_group: "review-env-${CI_PIPELINE_ID}"
  variables:
    NAMESPACE: "frn-ci-review-${CI_PIPELINE_ID}"
    # A review environment is meant to be browsed, not tested: skip the tests.
    HELM_EXTRA_ARGS: "--set systemTests.enabled=false"
  environment:
    name: "review/${CI_COMMIT_REF_SLUG}"
    url: "https://console--${CI_PIPELINE_ID}.qual.apps.france-nuage.fr"
    on_stop: "stop / review-env"
    auto_stop_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true

"stop / review-env":
  extends: .cleanup_ci_env
  stage: cleanup
  variables:
    NAMESPACE: "frn-ci-review-${CI_PIPELINE_ID}"
  environment:
    name: "review/${CI_COMMIT_REF_SLUG}"
    action: stop
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
