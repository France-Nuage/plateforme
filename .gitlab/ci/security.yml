gitleaks:
  stage: security
  image:
    name: registry.france-nuage.fr/zricethezav/gitleaks:v8.24.2
    entrypoint: [""]
  services: []
  before_script: []
  script:
    - >
      gitleaks detect
      --source .
      --verbose
      --report-format json
      --report-path gitleaks-report.json
      --exit-code 1
  artifacts:
    paths:
      - gitleaks-report.json
    when: always
    expire_in: 1 week
