"code style / controlplane":
  stage: code-style
  image: registry.france-nuage.fr/library/rust:1.90-alpine
  services: []
  needs: []
  variables:
    SQLX_OFFLINE: "true"
    KUBERNETES_CPU_LIMIT: "8000m"
    KUBERNETES_MEMORY_LIMIT: "16384Mi"
  before_script:
    - apk add --no-cache musl-dev openssl-dev openssl-libs-static protobuf-dev
    - rustup component add rustfmt clippy
    - cd controlplane
  script:
    - cargo fmt --check
    - cargo clippy --workspace -- -D warnings
  rules:
    - changes:
        - controlplane/**/*
        - .gitlab-ci.yml

